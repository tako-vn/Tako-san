# Required production Environment reviewers are operator-managed, never configured by this workflow.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: production
      ref:
        description: Full release SHA or refs/tags/v* tag resolving to current main (not a branch)
        type: string
        required: true
      hardened_sha:
        description: Exact final hardening SHA approved by the release owner; release must contain it
        type: string
        required: true
      confirm_production:
        description: Confirm this is an intentional production deployment
        type: boolean
        default: false
      recipe_catalog_mode:
        description: 'Recipe catalog authority state (T19B, ADR-026): static | shadow | canary (deterministic household cohort) | d1 (every household served the verified 500-recipe D1 release)'
        type: choice
        options: [static, shadow, canary, d1]
        default: static
      recipe_catalog_d1_canary_percent:
        description: Deterministic D1 canary percentage (0 for static/shadow/d1; 1/2/5/25 for canary)
        type: choice
        options: ['0', '1', '2', '5', '25']
        default: '0'
      confirm_recipe_catalog_rollback:
        description: Confirm an intentional authority downgrade to shadow/static (never needed for promotion)
        type: boolean
        default: false
      meal_composition_v2_enabled:
        description: 'T20 Meal Composition V2: sets BOTH the Worker MEAL_COMPOSITION_V2_ENABLED var and the build-time VITE_MEAL_COMPOSITION_V2_ENABLED UI flag together (requires migration 0039; false rolls back)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: frigo-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  release:
    # Only the reviewed workflow on main can authorize an immutable release.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       (inputs.environment == 'staging' || inputs.confirm_production == true)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.gate.outputs.deploy_sha }}
      recipe_catalog_mode: ${{ steps.gate.outputs.recipe_catalog_mode }}
      recipe_catalog_d1_canary_percent: ${{ steps.gate.outputs.recipe_catalog_d1_canary_percent }}
      recipe_catalog_cutover_enabled: ${{ steps.gate.outputs.recipe_catalog_cutover_enabled }}
      meal_composition_v2_enabled: ${{ steps.gate.outputs.meal_composition_v2_enabled }}
    steps:
      - name: Checkout trusted main release policy and full ancestry
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require main ancestry, approved hardening, and exact-SHA hosted CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          HARDENED_SHA: ${{ inputs.hardened_sha }}
          RELEASE_ENVIRONMENT: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
          RECIPE_CATALOG_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.recipe_catalog_mode || 'static' }}
          RECIPE_CATALOG_D1_CANARY_PERCENT: ${{ github.event_name == 'workflow_dispatch' && inputs.recipe_catalog_d1_canary_percent || '0' }}
          RECIPE_CATALOG_ROLLBACK_CONFIRMED: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_recipe_catalog_rollback || false }}
          MEAL_COMPOSITION_V2_ENABLED_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.meal_composition_v2_enabled || false }}
        run: node scripts/release-check.mjs gate

      - name: Save immutable candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

  staging:
    needs: release
    if: github.event_name == 'workflow_run' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify staging configuration exists
        run: |
          if [ ! -f wrangler.staging.jsonc ]; then
            echo "::notice::Staging is not provisioned; no deployment attempted."
            echo "STAGING_UNCONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Require staging proof configuration before deployment
        if: env.STAGING_UNCONFIGURED != 'true'
        env:
          APP_SMOKE_URL: ${{ vars.STAGING_URL }}
          RELEASE_VERIFY_TOKEN: ${{ secrets.STAGING_RELEASE_VERIFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            const url = new URL(process.env.APP_SMOKE_URL);
            if (url.protocol !== "https:" || url.origin !== process.env.APP_SMOKE_URL) throw new Error("STAGING_URL must be an exact HTTPS origin");
            if (!process.env.RELEASE_VERIFY_TOKEN || process.env.RELEASE_VERIFY_TOKEN.length < 32) throw new Error("STAGING_RELEASE_VERIFY_TOKEN must be configured before deployment");
          '
          pnpm wrangler secret list --config wrangler.staging.jsonc --format json > staging-worker-secrets.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const values = JSON.parse(readFileSync("staging-worker-secrets.json", "utf8"));
            if (!Array.isArray(values) || !values.some((entry) => entry?.name === "RELEASE_VERIFY_TOKEN")) {
              throw new Error("Staging Worker RELEASE_VERIFY_TOKEN is not provisioned");
            }
          '

      - name: Build
        if: env.STAGING_UNCONFIGURED != 'true'
        env:
          GIT_COMMIT: ${{ needs.release.outputs.deploy_sha }}
          VITE_MEAL_COMPOSITION_V2_ENABLED: ${{ needs.release.outputs.meal_composition_v2_enabled }}
        run: pnpm build

      - name: Require matching Meal Composition V2 server and UI flags
        if: env.STAGING_UNCONFIGURED != 'true'
        env:
          MEAL_COMPOSITION_V2_ENABLED: ${{ needs.release.outputs.meal_composition_v2_enabled }}
          VITE_MEAL_COMPOSITION_V2_ENABLED: ${{ needs.release.outputs.meal_composition_v2_enabled }}
        run: node scripts/composition-flags.mjs verify release-manifest.json dist/composition-flags.json

      - name: Recheck exact-head CI after environment approval
        if: env.STAGING_UNCONFIGURED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-check.mjs recheck

      # Captured before deploy so the post-deploy proof can recognise the exact previous Worker
      # still answering during convergence. That evidence is only ever retried, never accepted.
      - name: Capture and validate current staging recipe authority before deployment
        if: env.STAGING_UNCONFIGURED != 'true'
        env:
          APP_SMOKE_URL: ${{ vars.STAGING_URL }}
          RELEASE_VERIFY_TOKEN: ${{ secrets.STAGING_RELEASE_VERIFY_TOKEN }}
        run: node scripts/release-check.mjs previous-authority release-manifest.json

      - name: Deploy to Cloudflare staging
        if: env.STAGING_UNCONFIGURED != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.staging.jsonc --var GIT_COMMIT:${{ needs.release.outputs.deploy_sha }} --var RECIPE_CATALOG_MODE:${{ needs.release.outputs.recipe_catalog_mode }} --var RECIPE_CATALOG_D1_CANARY_PERCENT:${{ needs.release.outputs.recipe_catalog_d1_canary_percent }} --var RECIPE_CATALOG_CUTOVER_ENABLED:${{ needs.release.outputs.recipe_catalog_cutover_enabled }} --var MEAL_COMPOSITION_V2_ENABLED:${{ needs.release.outputs.meal_composition_v2_enabled }}

      # Exact-SHA proof polls readiness within a bounded deadline: the edge may briefly serve the
      # previous Worker version after upload. Only that propagation case is retried; nothing redeploys.
      - name: Staging exact SHA receipt and post-deploy smoke
        if: env.STAGING_UNCONFIGURED != 'true'
        env:
          APP_SMOKE_URL: ${{ vars.STAGING_URL }}
          EXPECTED_RECIPE_CATALOG_MODE: ${{ needs.release.outputs.recipe_catalog_mode }}
          RELEASE_VERIFY_TOKEN: ${{ secrets.STAGING_RELEASE_VERIFY_TOKEN }}
        run: |
          node scripts/wait-for-deployed-release.mjs release-manifest.json
          bash scripts/post-deploy-smoke.sh "$APP_SMOKE_URL" "${{ needs.release.outputs.deploy_sha }}"
          node scripts/release-check.mjs authority release-manifest.json

      - name: Save staging receipt after exact-SHA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          retention-days: 90

  production:
    needs: release
    if: >-
      always() && needs.release.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' && inputs.confirm_production == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout pinned approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Require explicit production smoke origin
        env:
          APP_SMOKE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          node --input-type=module -e '
            const value = process.env.APP_SMOKE_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value) throw new Error("PRODUCTION_URL must be an exact HTTPS origin");
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Local gates
        env:
          GIT_COMMIT: ${{ needs.release.outputs.deploy_sha }}
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check:migrations

      - name: Build
        env:
          GIT_COMMIT: ${{ needs.release.outputs.deploy_sha }}
          VITE_MEAL_COMPOSITION_V2_ENABLED: ${{ needs.release.outputs.meal_composition_v2_enabled }}
        run: pnpm build

      - name: Require matching Meal Composition V2 server and UI flags
        env:
          MEAL_COMPOSITION_V2_ENABLED: ${{ needs.release.outputs.meal_composition_v2_enabled }}
          VITE_MEAL_COMPOSITION_V2_ENABLED: ${{ needs.release.outputs.meal_composition_v2_enabled }}
        run: node scripts/composition-flags.mjs verify release-manifest.json dist/composition-flags.json

      - name: Recheck exact-head CI after approval and local gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-check.mjs recheck

      # SELECT-only; identity/catalog/integrity drift and missing/unknown migrations block deployment.
      - name: Pre-deploy Cloudflare identity, schema, catalog and integrity certification (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/d1-migration-check.mjs config
          pnpm wrangler whoami > /dev/null
          pnpm wrangler d1 list --json > d1-list.json
          if pnpm wrangler d1 info frigo-db --json > d1-info.json 2> d1-info.err; then
            node scripts/d1-migration-check.mjs identity release-manifest.json d1-list.json d1-info.json
          else
            echo "::warning::d1 info unavailable with this token scope; identity proven from d1 list only"
            node scripts/d1-migration-check.mjs identity release-manifest.json d1-list.json
          fi
          bash scripts/d1-schema-gate.sh remote
          pnpm wrangler d1 execute frigo-db --remote --yes --command "SELECT name FROM d1_migrations ORDER BY name" --json > migration-ledger.json
          node scripts/release-check.mjs schema release-manifest.json migration-ledger.json
          catalog_query="$(node -e 'import("./scripts/d1-migration-check.mjs").then((m) => process.stdout.write(m.catalogQuery()))')"
          pnpm wrangler d1 execute frigo-db --remote --yes --json --command "$catalog_query" > catalog.json
          node scripts/d1-migration-check.mjs runtime-catalog-query > runtime-catalog.sql
          node scripts/d1-readonly-query.mjs runtime-catalog
          node scripts/d1-migration-check.mjs runtime-catalog release-manifest.json runtime-catalog.json
          pnpm wrangler d1 execute frigo-db --remote --yes --json --command "PRAGMA foreign_key_check" > foreign-keys.json
          pnpm wrangler d1 execute frigo-db --remote --yes --json --command "PRAGMA quick_check" > quick-check.json
          node scripts/d1-migration-check.mjs release-certify release-manifest.json catalog.json foreign-keys.json quick-check.json

      - name: Preflight release secret, current authority transition, and rollback target
        id: preflight
        env:
          APP_SMOKE_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_VERIFY_TOKEN: ${{ secrets.RELEASE_VERIFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${#RELEASE_VERIFY_TOKEN}" -lt 32 ]; then
            echo "RELEASE_VERIFY_TOKEN must be provisioned before deployment"
            exit 1
          fi
          pnpm wrangler secret list --format json > worker-secrets.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const values = JSON.parse(readFileSync("worker-secrets.json", "utf8"));
            if (!Array.isArray(values) || !values.some((entry) => entry?.name === "RELEASE_VERIFY_TOKEN")) {
              throw new Error("Production Worker RELEASE_VERIFY_TOKEN is not provisioned");
            }
          '
          status="$(curl --silent --show-error --output previous-authority.json --write-out '%{http_code}' \
            --max-time 30 --header "Authorization: Bearer ${RELEASE_VERIFY_TOKEN}" \
            --header 'Accept: application/json' "${APP_SMOKE_URL}/api/v1/health/recipe-authority" || true)"
          legacy_authority=false
          if [ "$status" = 404 ]; then
            printf '{"unavailable":true,"httpStatus":404}\n' > previous-authority.json
          elif [ "$status" = 401 ]; then
            # Pre-T19 Worker: auth middleware 401s before routing. Verified below against its GIT_COMMIT.
            legacy_authority=true
          elif [ "$status" != 200 ]; then
            echo "Recipe authority preflight failed with HTTP ${status}"
            exit 1
          fi
          pnpm wrangler deployments status --json > previous-deployment.json
          node scripts/release-check.mjs deployment-snapshot release-manifest.json previous-deployment.json
          previous_version="$(node -p 'require("./release-manifest.json").previousDeployment.versionId')"
          pnpm wrangler versions view "$previous_version" --name frigo --json > previous-version.json
          node scripts/release-check.mjs rollback-target release-manifest.json previous-version.json
          if [ "$legacy_authority" = true ]; then
            node scripts/release-check.mjs legacy-authority release-manifest.json previous-version.json previous-authority.json
          fi
          node scripts/release-check.mjs transition release-manifest.json previous-authority.json

      - name: Deploy to Cloudflare production
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var GIT_COMMIT:${{ needs.release.outputs.deploy_sha }} --var RECIPE_CATALOG_MODE:${{ needs.release.outputs.recipe_catalog_mode }} --var RECIPE_CATALOG_D1_CANARY_PERCENT:${{ needs.release.outputs.recipe_catalog_d1_canary_percent }} --var RECIPE_CATALOG_CUTOVER_ENABLED:${{ needs.release.outputs.recipe_catalog_cutover_enabled }} --var MEAL_COMPOSITION_V2_ENABLED:${{ needs.release.outputs.meal_composition_v2_enabled }}

      # T19D: the deployment is not successful until the Worker proves, through the protected
      # recipe-authority evidence, that it serves exactly the approved authority state (mode,
      # cutover, percent, release ID, D1 readiness, served count/fingerprint, no fallback).
      - name: Production exact SHA receipt, post-deploy smoke and recipe authority proof
        env:
          APP_SMOKE_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_RECIPE_CATALOG_MODE: ${{ needs.release.outputs.recipe_catalog_mode }}
          RELEASE_VERIFY_TOKEN: ${{ secrets.RELEASE_VERIFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/wait-for-deployed-release.mjs release-manifest.json
          bash scripts/post-deploy-smoke.sh "$APP_SMOKE_URL" "${{ needs.release.outputs.deploy_sha }}"
          pnpm wrangler deployments status --name frigo --json > deployed-deployment.json
          deployed_version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { verifyStableWorkerDeployment } from "./scripts/release-check.mjs";
            const evidence = JSON.parse(readFileSync("deployed-deployment.json", "utf8"));
            process.stdout.write(verifyStableWorkerDeployment(evidence).versionId);
          ')"
          pnpm wrangler versions view "$deployed_version" --name frigo --json > deployed-version.json
          node scripts/release-check.mjs deployed-binding release-manifest.json deployed-deployment.json deployed-version.json
          node scripts/release-check.mjs authority release-manifest.json

      - name: Restore exact previous Worker after any failed deployment or proof
        if: (failure() || cancelled()) && steps.preflight.outcome == 'success'
        env:
          APP_SMOKE_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_VERIFY_TOKEN: ${{ secrets.RELEASE_VERIFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          previous_version="$(node -e "const m=require('./release-manifest.json'); process.stdout.write(m.previousDeployment.versionId)")"
          legacy_previous="$(node -e "const m=require('./release-manifest.json'); process.stdout.write(m.previousRecipeAuthority?.legacyWorkerCommit ? 'true' : 'false')")"
          node scripts/cloudflare-worker-rollback.mjs "$previous_version" > rollback-mutation.json
          restored=false
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! timeout 20s pnpm wrangler deployments status --name frigo --json > rollback-deployment.json; then
              sleep 3
              continue
            fi
            status="$(curl --silent --show-error --output rollback-authority.json --write-out '%{http_code}' \
              --max-time 10 --header "Authorization: Bearer ${RELEASE_VERIFY_TOKEN}" \
              --header 'Accept: application/json' "${APP_SMOKE_URL}/api/v1/health/recipe-authority" || true)"
            if [ "$status" = 404 ] || { [ "$status" = 401 ] && [ "$legacy_previous" = true ] && \
              ! grep -q '"code":"RELEASE_VERIFY_UNAUTHORIZED"' rollback-authority.json; }; then
              printf '{"unavailable":true,"httpStatus":%s}\n' "$status" > rollback-authority.json
              status=unavailable
            fi
            if { [ "$status" = 200 ] || [ "$status" = unavailable ]; } && \
              node scripts/release-check.mjs rollback release-manifest.json rollback-deployment.json rollback-authority.json previous-version.json rollback-mutation.json; then
              restored=true
              break
            fi
            sleep 3
          done
          if [ "$restored" != true ]; then
            echo "Exact previous Worker rollback could not be verified"
            exit 1
          fi

      - name: Save production receipt even on failure (inspect deployed field)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          retention-days: 90
